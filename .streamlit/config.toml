# Streamlit app configuration
[theme]
base = "dark"
primaryColor = "#818cf8"
backgroundColor = "#0d0d1a"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = false
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
